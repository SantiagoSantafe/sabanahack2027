# Alternative F (principal) — Fixed sensor network + D1
# Environmental risk prioritizes which beds the robot inspects first.
# Dato empresa: el robot NO va ligado al aspersor y patrulla según el riesgo, sobre todo de noche o al
# amanecer (gutación). Aquí: sale a las 05:00 y recorre primero los pasillos de mayor riesgo.
code: F
name: "Red fija + D1"
title: "F · Red fija + D1 (híbrido)"

sensor:
  camera_height_m: 0.30   # stock D1 low camera
  sees_full_bush: false
  base_sensitivity: 1.0

schedule:
  every_n_days: 2         # SUPUESTO — frecuencia fija; el riesgo ordena los pasillos, no agrega recorridos
  only_spray_days: false
  start_hour: 5.0         # SUPUESTO — amanecer, hoja mojada (ver sim.yaml → time.patrol_start_hour)

prioritize_by_risk: true

risk_trigger:
  enabled: true
  level: bed
  action: none            # risk used for prioritization, not human-only review
  risk_threshold: 0.0     # every aisle is ordered by its measured risk (highest first)

mobility:
  width_m: 0.36            # AgiBot D1 Ultra 630x360x420 mm (oficial)
  height_m: 0.42
  rigid: false            # rígida: no puede apartar ramas
  speed_mps: 0.5
  battery_h: 1.5
  fail_prob_per_bed: 0.0
  mud_slowdown: 1.0
  stuck_prob: 0.0

fog_sensitivity_penalty: 1.0

human_review:
  enabled: false
  sensitivity_small: 0.0
  sensitivity_underside: 0.0

mast: false
platform: quadruped
