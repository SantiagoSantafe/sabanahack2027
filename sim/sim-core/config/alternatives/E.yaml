# Alternative E — Wheeled platform with tall torso (Husky/Thorvald class)
# Sees full bush; slows / sticks in mud
code: E
name: "Plataforma con ruedas y torso alto"
title: "E · Ruedas + torso alto"

sensor:
  camera_height_m: 1.4    # SUPUESTO — mast on wheeled base
  sees_full_bush: true
  base_sensitivity: 1.0

schedule:
  every_n_days: 3         # SUPUESTO
  only_spray_days: false
  start_hour: 5.0         # SUPUESTO — misma hora que F (amanecer); el robot no va ligado al aspersor

prioritize_by_risk: false

risk_trigger:
  enabled: false
  level: bed
  action: none

mobility:
  width_m: 0.70            # SUPUESTO — base clase Husky (0,67 m) con torso alto
  height_m: 1.50
  rigid: true            # rígida: no puede apartar ramas
  speed_mps: 0.8          # SUPUESTO — Thorvald ~1.5 m/s max; inspection slower
  battery_h: 8.0          # wheeled platforms typically longer runtime
  fail_prob_per_bed: 0.0
  mud_slowdown: 2.0       # SUPUESTO — halves effective speed when wet/muddy
  stuck_prob: 0.06        # SUPUESTO — mud stuck probability per bed when wet

fog_sensitivity_penalty: 1.0

human_review:
  enabled: false
  sensitivity_small: 0.0
  sensitivity_underside: 0.0

mast: false
platform: wheeled
