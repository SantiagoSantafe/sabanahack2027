# Alternative B — Fixed environmental sensor network
# Marks risk by bed/block; triggers human review of the whole block — no plant-level camera
code: B
name: "Red fija de sensores"
title: "B · Red fija de sensores"

sensor:
  camera_height_m: 0.0
  sees_full_bush: false
  base_sensitivity: 0.0   # no onboard vision

schedule:
  every_n_days: 3         # SUPUESTO — sensor alert cadence for human review
  only_spray_days: false
  start_hour: 9.0         # SUPUESTO — dentro del turno de operarios 6-14 h (dato empresa); se conserva la hora anterior

prioritize_by_risk: false

risk_trigger:
  enabled: true
  level: bed              # SUPUESTO — bed-level risk triggers review
  action: human_review
  # Umbral de acción PUBLICADO de Botrytis (índice >= 0,50; MacKenzie y Peres 2012b, Plant Dis. 96:529),
  # que también es el "alto" de antracnosis. Antes 0,12, ajustado a la escala de los modelos sin fuente.
  # Con el clima 2025 se dispara en ~15 días al año (el 0,12 viejo, en ~16).
  risk_threshold: 0.50

mobility:
  width_m: 0.0            # sin plataforma móvil
  height_m: 0.0
  rigid: false            # rígida: no puede apartar ramas
  speed_mps: 0.0          # no robot
  battery_h: 0.0
  fail_prob_per_bed: 0.0
  mud_slowdown: 1.0
  stuck_prob: 0.0

fog_sensitivity_penalty: 1.0

human_review:
  enabled: true
  # Human scouting sensitivity proxies (peach study ~80–91%; no blueberry study)
  sensitivity_small: 0.70      # SUPUESTO — weak on small symptoms
  sensitivity_underside: 0.55  # SUPUESTO — underside often missed
  review_delay_days: 1.0       # SUPUESTO
  # Also review on schedule days (not only risk spikes)
  review_on_schedule: true     # SUPUESTO

mast: false
platform: none
