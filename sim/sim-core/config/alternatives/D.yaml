# Alternative D — Humanoid (Unitree G1 / AgiBot A2 class)
# Like A but less autonomy; fall / stop probability on bad terrain
code: D
name: "Humanoide"
title: "D · Humanoide"

sensor:
  camera_height_m: 1.2    # EST — head camera G1/X2 class
  sees_full_bush: true
  base_sensitivity: 0.95

schedule:
  every_n_days: 3         # SUPUESTO
  only_spray_days: false
  start_hour: 5.0         # SUPUESTO — misma hora que F (amanecer); el robot no va ligado al aspersor

prioritize_by_risk: false

risk_trigger:
  enabled: false
  level: bed
  action: none

mobility:
  width_m: 0.45            # SUPUESTO — clase Unitree G1 (1,32 m)
  height_m: 1.32
  rigid: false            # rígida: no puede apartar ramas
  speed_mps: 0.4          # SUPUESTO — cautious outdoor pace (G1 max 2 m/s flat)
  battery_h: 1.5          # ~1.5–2 h walking typical
  # Fall / stop on rough or wet terrain (G1 manual: avoid wet/soft ground)
  fail_prob_per_bed: 0.08 # SUPUESTO — probability of fall/stop per bed traversed
  mud_slowdown: 1.5       # SUPUESTO
  stuck_prob: 0.05        # SUPUESTO

fog_sensitivity_penalty: 1.0

human_review:
  enabled: false
  sensitivity_small: 0.0
  sensitivity_underside: 0.0

mast: false
platform: humanoid
