# Parámetros del modelo de negocio (rol: modelo-negocio). Sabana Hack 2026, reto "Berry Good Idea".
# Cada parámetro tiene "valor" y "fuente". La fuente es:
#   FUENTE: <URL abierta en esta sesión>    -> cifra leída en la página
#   CALCULADO: <operación sobre una FUENTE>  -> derivada, la operación es nuestra
#   CONTEXTO: dato que nos pasó el equipo, NO VERIFICADO por este rol
#   SUPUESTO: valor nuestro, sin fuente; mover para ver la sensibilidad
#   NO VERIFICADO: la cifra solo apareció en un resumen de búsqueda, sin abrir la página
# Formato: YAML de bloques simple (sin listas), para que unit_economics.py lo lea
# con PyYAML o, si no está instalado, con su lector mínimo incluido.

