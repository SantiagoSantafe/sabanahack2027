# =============================================================================
# Parámetros del modelo financiero - Sabana Hack "Berry Good Idea"
# Fecha de corte: 2026-10-23.  Moneda del modelo: USD (salvo indicación).
#
# Convención de cada parámetro:
#   base / pes / opt : valor base, pesimista (desfavorable al proyecto) y
#                      optimista (favorable al proyecto).
#   tipo             : FUENTE (verificado en la fuente citada),
#                      DERIVADO (calculado a partir de fuentes),
#                      SUPUESTO (sin fuente; decisión del equipo / analista),
#                      NO VERIFICADO (cifra recibida que no se pudo confirmar).
#   fuente           : id en la sección `fuentes` (URLs abiertas el 2026-10-23).
#   en_escenarios    : false = se fija en base para los escenarios
#                      pesimista/base/optimista y solo se mueve en el tornado.
# Modelo (por ha y año):
#   B = Y*P*L*f*mult_f + n*C_ap*mult_n + J*w*mult_J
#   C = CAPEX/vida + OPEX  (también se reporta con factor de recuperación de
#       capital a la WACC)   ;  ROI = (B - C) / C
# =============================================================================

macro:
  trm_cop_usd:
    base: 3185.01
    pes: 3900.82
    opt: 3048.12
    tipo: FUENTE
    fuente: trm_datosgov
    nota: >-
      Base = TRM vigente el 2026-10-23 (3.185,01). pes/opt = máximo/mínimo de los
      últimos 12 meses (236 observaciones desde 2025-10-23). Solo afecta el jornal
      en USD (una TRM alta abarata el jornal en USD y reduce el beneficio J*w).
  smmlv_2026_cop:
    base: 1750905
    tipo: FUENTE
    fuente: [smmlv_buk, smmlv_eltiempo]
    nota: >-
      Decreto 1469 del 29-dic-2025 (+23,0 % sobre 1.423.500 de 2025; corregido por
      verificacion-finanzas-robots-documento: decía 23,7 %). Auxilio de transporte 249.095 COP
      (Decreto 1470 de 2025). El Consejo de Estado lo suspendió provisionalmente
      el 12-feb-2026 (Decreto transitorio 0159 de 2026 mantuvo el mismo valor) y
      revocó la suspensión el 9-jul-2026; el valor pagado no cambió.
  auxilio_transporte_2026_cop:
    base: 249095
    tipo: FUENTE
    fuente: smmlv_buk
  factor_prestacional_jornal:
    base: 0.30
    pes: 0.0
    opt: 0.52
    tipo: FUENTE (base) / SUPUESTO (pes, opt)
    fuente: [jornal_icef]
    nota: >-
      Base: proyecto de ley 504 de 2025 (jornal agropecuario >= SMMLV diario + factor
      prestacional >= 30 %); es PROYECTO, no ley vigente. pes = jornal informal igual
      al SMMLV diario (Peña et al. 2023 reportan pago informal en el sector). opt =
      costo empleador formal completo ~52 % (SUPUESTO, NO VERIFICADO).

cultivo:
  rendimiento_kg_ha:
    base: 12000
    pes: 8000
    opt: 20000
    tipo: FUENTE (base, opt) / SUPUESTO (pes)
    fuente: [forbes_2026, eltiempo_2026, agronegocios_2026, pena_2023]
    nota: >-
      Base: Forbes Colombia (26-may-2026) "algunos cultivos rinden cerca de 12 t/ha";
      El Tiempo (4-may-2026) 12.000 t en ~1.000 ha. opt: Asocolblue vía Agronegocios
      (11-feb-2026) ~20.000 t/año en ~1.000 ha => ~20 t/ha (cálculo propio); meta
      Planasa >20 t/ha. pes: plantación joven (Peña et al. 2023: 0,5 kg/planta en el
      año 1 x 7.680 plantas = 3,8 t/ha; 8 t/ha es SUPUESTO intermedio).
  precio_usd_kg:
    base: 6.0
    pes: 4.0
    opt: 9.0
    tipo: SUPUESTO anclado en fuentes
    fuente: [forbes_2026, eltiempo_2026, agronegocios_2026, gestion_2026]
    nota: >-
      opt = punto medio de Planasa (8-10 USD/kg en finca, Forbes 2026; es estimación
      de una empresa). Base 6,0: FOB implícito de las exportaciones colombianas 2025
      (574.607 kg por 3-3,5 MUSD => 5,2-6,1 USD/kg, El Tiempo 2026) y FOB Perú 2025
      6,22 USD/kg (Gestión 14-ene-2026). pes 4,0: comercio interno formal >200.000 M
      COP/año (Asocolblue) / 12.000-20.000 t => ~10.000-16.700 COP/kg => 3,1-5,2 USD/kg
      a TRM 3.185 (DERIVADO, grueso).
  perdida_base_frac:
    base: 0.10
    pes: 0.05
    opt: 0.20
    tipo: SUPUESTO anclado en fuentes (EE. UU.)
    fuente: [neugebauer_2024, msu_e3039]
    nota: >-
      Fracción de cosecha que hoy se pierde por las enfermedades/plagas objetivo pese
      al manejo actual. Antracnosis: 10-20 % precosecha en campos bien manejados y
      hasta 100 % en poscosecha (MSU E3039, 2008; Neugebauer et al. 2024). Botrytis:
      episódica, hasta 30-40 % (Bristow et al. 2017 citado en Neugebauer et al. 2024).
      Roya: MSU indica que no hay estudios de pérdida de rendimiento (efecto vía
      defoliación y floración del año siguiente). No hay dato colombiano.
  costo_produccion_usd_kg:
    base: 4.25
    pes: 5.0
    opt: 3.5
    tipo: FUENTE (Planasa vía Forbes; informativo, no entra al ROI)
    fuente: forbes_2026
  area_nacional_ha:
    base: 1000
    tipo: FUENTE
    fuente: [agronegocios_2026, eltiempo_2026]
    nota: "Asocolblue (feb-2026) ~1.000 ha; la cifra previa de 500 ha queda desactualizada."

beneficio:
  f_fraccion_evitada:
    base: 0.25
    pes: 0.10
    opt: 0.40
    tipo: SUPUESTO
    nota: >-
      Fracción de la pérdida base que se evita por detección temprana cama por cama
      (sistema completo = híbrido). No existe estudio publicado para arándano con
      robot; debe medirse en piloto.
  n_aplicaciones_evitadas_ha_anio:
    base: 6
    pes: 2
    opt: 12
    tipo: SUPUESTO anclado en fuente (fresa)
    fuente: stas_ufifas
    nota: >-
      Sistema de alerta por modelo ambiental en fresa (StAS, Florida): -50 % de
      fungicida sin pérdida de rendimiento en 39 fincas (UF/IFAS 2017). Se supone un
      programa calendario de ~24 aplicaciones fungicidas/año en Colombia (SUPUESTO,
      producción continua y lluvias); base = -25 %, opt = -50 %.
  costo_aplicacion_usd_ha:
    base: 95
    pes: 60
    opt: 130
    tipo: DERIVADO
    fuente: [odepa_2021, clp_2021, trm_datosgov, jornal_icef]
    nota: >-
      ODEPA Maule 2020-21: servicio de maquinaria 25.000 CLP/ha por aplicación,
      0,5 jornada x 20.000 CLP, fungicidas 266.560 CLP/temporada (~6 aplicaciones =>
      ~44.400 CLP) => ~79.400 CLP ~= 112 USD a 707,85 CLP/USD (abr-2021). Ajuste
      Colombia: producto ~63 USD + 1,5 jornales x 23,8 USD (bomba de espalda o
      estacionaria, SUPUESTO) ~= 99 USD -> base 95.
  jornales_ahorrados_ha_anio:
    base: 3
    pes: 0
    opt: 8
    tipo: SUPUESTO
    nota: >-
      Neto: monitoreo MIP manual (~1 monitor por 20-25 ha) que el robot reemplaza
      (~50 %) menos el tiempo del operador del robot (~0,25 FTE por finca de 20 ha).
  falsas_alarmas_ha_anio:
    base: 5
    pes: 12
    opt: 2
    tipo: SUPUESTO
    nota: "Reemplazar con la matriz de confusión del clasificador (umbral sensibilidad >= 90 %)."
  costo_falsa_alarma_usd:
    base: 30
    pes: 40
    opt: 20
    tipo: SUPUESTO (equipo)
  costo_no_detectado_usd_ha_semana:
    base: 2160
    tipo: SUPUESTO (equipo)
    nota: "Solo se usa para chequear consistencia y el umbral de decisión."

importacion:
  arancel_frac:
    base: 0.05
    pes: 0.05
    opt: 0.0
    tipo: FUENTE (tasa) / NO VERIFICADO (clasificación)
    fuente: dian_arancel
    nota: >-
      Arancel de Aduanas (Decreto 1881 de 2021, compilación DIAN con modificaciones
      hasta 2026): 8479.50.00.00 "Robots industriales, n.e.p." 5 %; 8479.89.90.00
      "Los demás" (máquinas con función propia) 5 %; 8543.70.90.00 (máquinas
      eléctricas con función propia, las demás) 0 % (Decreto 1530 de 2024). La
      subpartida del cuadrúpedo requiere clasificación arancelaria anticipada (DIAN).
      El TLC/Alianza del Pacífico con México NO aplica a robots de origen chino.
  iva_frac:
    base: 0.19
    tipo: FUENTE
    fuente: [et_468, et_459]
    nota: "Tarifa general 19 % (ET art. 468, Ley 1819/2016 art. 184). Base: valor aduanero + arancel (ET art. 459)."
  iva_recuperable:
    base: false
    pes: false
    opt: true
    tipo: SUPUESTO / NO VERIFICADO
    nota: >-
      El arándano fresco se vende sin IVA, así que el IVA de la importación sería
      costo. opt = descuento en renta por IVA de activos fijos productivos (ET art.
      258-1), no verificado para este caso; consultar contador.
  flete_usd_kg:
    base: 5.0
    pes: 8.0
    opt: 3.0
    tipo: SUPUESTO
    nota: "Aéreo México->Bogotá, carga general por kg tasable. Pedir cotización a un agente de carga."
  flete_fijo_usd:
    base: 150
    tipo: SUPUESTO
    nota: "Documentación y manejo por embarque."
  seguro_frac_fob:
    base: 0.01
    tipo: SUPUESTO
  agencia_aduanas_usd:
    base: 300
    tipo: SUPUESTO
    nota: "Agencia de aduanas + bodegaje por embarque."
  transporte_interno_usd:
    base: 50
    tipo: SUPUESTO
  factor_previo_equipo:
    base: 1.35
    tipo: SUPUESTO (equipo)

